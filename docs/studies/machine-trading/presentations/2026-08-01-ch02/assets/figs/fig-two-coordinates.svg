<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" role="img">
  <defs>
    <marker id="ah2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0F2C59"/></marker>
    <style>
      .box{fill:#fff;stroke:#0F2C59;stroke-width:1.4}
      .key{fill:#0F2C59;stroke:#0F2C59}
      .obs{fill:#E8F1EA;stroke:#1B6B3A;stroke-width:1.4}
      .unk{fill:#F3F1EC;stroke:#8A8377;stroke-width:1.4;stroke-dasharray:5 3}
      .t{fill:#0F0F10;font-size:13px;font-weight:700;text-anchor:middle}
      .tk{fill:#fff;font-size:13.5px}
      .s{fill:#57534E;font-size:10.5px;text-anchor:middle}
      .sk{fill:#C7D2E6}
      .lab{fill:#0F2C59;font-size:11.5px;font-weight:700;text-anchor:middle}
      .obst{fill:#1B6B3A;font-size:10.5px;font-weight:700;text-anchor:middle}
      .unkt{fill:#6B6357;font-size:10.5px;font-weight:700;text-anchor:middle}
      .a{stroke:#0F2C59;stroke-width:1.4;fill:none;marker-end:url(#ah2)}
      .e{fill:#0F2C59;font-size:10.5px;text-anchor:start}
    </style>
  </defs>

  <!-- shared equation -->
  <rect class="box key" x="150" y="14" width="420" height="46" rx="10"/>
  <text class="tk t" x="360" y="35">Return(t,s) − rF = α + β(s) × Factor(t) + ε</text>
  <text class="s sk" x="360" y="52">같은 한 줄을 어느 방향으로 읽느냐가 갈린다</text>

  <path class="a" d="M250,60 V96"/>
  <path class="a" d="M470,60 V96"/>

  <!-- left : time-series -->
  <text class="lab" x="176" y="114">시계열 요인</text>
  <rect class="obs" x="24" y="126" width="304" height="56" rx="9"/>
  <text class="obst" x="176" y="146">관측된다 · Factor(t)</text>
  <text class="s" x="176" y="166">시장 수익률 · HML · SMB · UMD</text>

  <path class="a" d="M176,182 V224"/>
  <text class="e" x="186" y="207">회귀로 캐낸다</text>

  <rect class="unk" x="24" y="230" width="304" height="52" rx="9"/>
  <text class="unkt" x="176" y="250">미지 · 적재량 β(s)</text>
  <text class="s" x="176" y="269">종목마다 다른 무차원 민감도</text>

  <!-- right : cross-sectional -->
  <text class="lab" x="544" y="114">횡단면 요인</text>
  <rect class="obs" x="392" y="126" width="304" height="56" rx="9"/>
  <text class="obst" x="544" y="146">관측된다 · 적재량 x(s)</text>
  <text class="s" x="544" y="166">ROE · BM · P/E · 유동성 · 공매도 잔량</text>

  <path class="a" d="M544,182 V224"/>
  <text class="e" x="554" y="207">회귀로 캐낸다</text>

  <rect class="unk" x="392" y="230" width="304" height="52" rx="9"/>
  <text class="unkt" x="544" y="250">미지 · Factor(t)</text>
  <text class="s" x="544" y="269">그 특성이 수익에 값하는 정도</text>
</svg>
