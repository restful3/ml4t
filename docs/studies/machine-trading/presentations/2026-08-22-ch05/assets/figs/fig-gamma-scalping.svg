<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="감마 스캘핑 메커니즘 다이어그램">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="100%" height="100%" fill="#FAF8F5" rx="8" stroke="#E5E7EB" stroke-width="1"/>

  <g font-family="system-ui, -apple-system, sans-serif" font-size="13">
    <!-- 상단: 롱 스트래들 / 스트랭글 (옵션 롱) -->
    <rect x="30" y="30" width="220" height="80" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
    <text x="140" y="55" font-size="14" font-weight="bold" fill="#991B1B" text-anchor="middle">헤지: 롱 스트래들 / 스트랭글</text>
    <text x="45" y="80" fill="#991B1B">■ 양(+)의 감마 및 베가 획득</text>
    <text x="45" y="98" fill="#991B1B">■ 음(−)의 세타 (시간가치 감소 비용)</text>

    <!-- 하단: 기초 선물 평균회귀 (선물 숏/롱) -->
    <rect x="30" y="130" width="220" height="80" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="140" y="155" font-size="14" font-weight="bold" fill="#1E3A8A" text-anchor="middle">수익원: 기초선물 평균회귀</text>
    <text x="45" y="180" fill="#1E40AF">■ 변동성 매도 성격의 매매</text>
    <text x="45" y="198" fill="#1E40AF">■ 등가격 이탈 시 델타 헤징</text>

    <!-- 화살표 및 메커니즘 매핑 -->
    <g transform="translate(260, 30)">
      <!-- 연결선들 -->
      <path d="M 10 35 L 70 35" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>
      <path d="M 10 135 L 70 135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>

      <text x="40" y="28" font-size="10" fill="#4B5563" text-anchor="middle">결합</text>
      <text x="40" y="128" font-size="10" fill="#4B5563" text-anchor="middle">헤지</text>
    </g>

    <!-- 오른쪽: 감마 스캘핑의 동적 작동 및 결과 -->
    <rect x="350" y="30" width="340" height="180" rx="6" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
    <text x="520" y="55" font-size="15" font-weight="bold" fill="#065F46" text-anchor="middle">감마 스캘핑 (Gamma Scalping)</text>

    <!-- 세부 작동 메커니즘 -->
    <g transform="translate(365, 75)" font-size="12">
      <!-- 1 -->
      <circle cx="10" cy="10" r="8" fill="#10B981"/>
      <text x="10" y="14" font-size="9" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
      <text x="25" y="14" fill="#065F46" font-weight="600">기초 주가 급등 → 옵션 델타 ↗ → 선물 숏 추가</text>

      <!-- 2 -->
      <circle cx="10" cy="35" r="8" fill="#10B981"/>
      <text x="10" y="39" font-size="9" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
      <text x="25" y="39" fill="#065F46" font-weight="600">기초 주가 폭락 → 옵션 델타 ↘ → 선물 롱 추가</text>

      <!-- 3 -->
      <circle cx="10" cy="60" r="8" fill="#10B981"/>
      <text x="10" y="64" font-size="9" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
      <text x="25" y="64" fill="#065F46" font-weight="600">스캘핑 이익(고가 매도, 저가 매수) 누적</text>

      <!-- 4 -->
      <circle cx="10" cy="85" r="8" fill="#10B981"/>
      <text x="10" y="89" font-size="9" fill="#fff" font-weight="bold" text-anchor="middle">4</text>
      <text x="25" y="89" fill="#034D35" font-weight="bold">블랙 스완 발생 시: 옵션 포지션이 손실 상쇄 (헤지)</text>
    </g>
  </g>
</svg>
